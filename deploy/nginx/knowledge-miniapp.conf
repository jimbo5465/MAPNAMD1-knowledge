server {
    listen 2083 ssl;
    listen [::]:2083 ssl;
    server_name web.mohsekarim8.ir;

    ssl_certificate     /etc/nginx/ssl/web.mohsekarim8.ir.pem;
    ssl_certificate_key /etc/nginx/ssl/web.mohsekarim8.ir.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/knowledge-miniapp;
    index index.html;

    add_header X-Content-Type-Options nosniff;

    # در فاز توسعه: مرورگر/وب‌ویو همیشه نسخهٔ تازه بگیرد
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
